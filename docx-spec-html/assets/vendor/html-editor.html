        // 在 <br> 后落一个折叠光标；若已在末尾则补一个 <br> 撑出空行
        range.setStartAfter(br);
        range.collapse(true);
        // 若 br 是最后一个节点，光标无法显示新空行，再补一个 <br>
        if (!br.nextSibling || (br.nextSibling.nodeType === 3 && br.nextSibling.data === '')) {
          var br2 = document.createElement('br');
          br.parentNode.insertBefore(br2, br.nextSibling);
          range.setStartBefore(br2);
          range.collapse(true);
        }
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }
    e.stopPropagation(); // 防止被全局捕获
  }

  function stopEditing(revert) {
    var id = editingId;
    editingId = null;
    if (!id) return;
    var el = findById(id);
    if (el) {
      if (revert && editingSnapshot !== null) {
        // Escape 取消：还原为进入编辑前的内容
        el.innerHTML = editingSnapshot;
      }
      el.removeAttribute('contenteditable');
      el.classList.remove('ed-editing');
      el.removeEventListener('blur', onBlurEdit);
      el.removeEventListener('keydown', onKeyEdit);
      if (!revert) {
        // 内容已变化，触发保存通知
        notifyChanged();
        notifySelect(buildInfo(el));
      } else if (editingHistoryPushed) {
        // 还原后撤销刚才的 beforeChange（因为实际没变化）
        // 简单做法：pop 掉刚才 push 的快照
        if (past.length > 0) past.pop();
        notifyHistory();
      }
    }
    editingSnapshot = null;
    editingHistoryPushed = false;
  }

  // ============ 悬浮工具条 ============

  function showToolbar(el) {
    toolbar = ensureToolbar();
    toolbar.style.display = 'flex';
    positionToolbar(el);
  }

  function ensureToolbar() {
    if (toolbar && toolbar.isConnected) return toolbar;
    var tb = document.createElement('div');
    tb.className = 'ed-toolbar';
    tb.setAttribute('data-ed-injected', '1');
    tb.innerHTML =
      '<span class="ed-toolbar-label" data-act="tag"></span>' +
      '<button class="ed-toolbar-btn" data-act="parent" title="选中父元素">▲</button>' +
      '<button class="ed-toolbar-btn" data-act="up" title="上移">⬆</button>' +
      '<button class="ed-toolbar-btn" data-act="down" title="下移">⬇</button>' +
      '<button class="ed-toolbar-btn" data-act="copy" title="复制到剪贴板（可选中其它模块后粘贴）">⧉</button>' +
      '<button class="ed-toolbar-btn" data-act="paste" title="粘贴到选中位置">📋</button>' +
      '<button class="ed-toolbar-btn ed-danger" data-act="delete" title="删除">✕</button>';
    tb.addEventListener('click', onToolbarClick);
    document.body.appendChild(tb);
    // 剪贴板为空时隐藏粘贴按钮（工具条重建后保持状态）
    var pasteBtn = tb.querySelector('[data-act="paste"]');
    if (pasteBtn) pasteBtn.style.display = clipboard.length ? '' : 'none';
    return tb;
  }

  function positionToolbar(el) {
    if (!toolbar) return;
    var rect = el.getBoundingClientRect();
    var scrollY = window.scrollY || 0;
    var scrollX = window.scrollX || 0;
    var top = rect.top + scrollY - 32;
    var left = rect.left + scrollX;
    if (top < scrollY) top = rect.bottom + scrollY + 4; // 放下方
    toolbar.style.top = top + 'px';
    toolbar.style.left = left + 'px';

    var label = toolbar.querySelector('[data-act="tag"]');
    if (label) {
      var tag = el.tagName.toLowerCase();
      if (el.id) tag += '#' + el.id;
      label.textContent = tag;
    }
  }

  function onToolbarClick(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var act = btn.getAttribute('data-act');
    var el = findById(selectedId);
    if (!el && act !== 'parent' && act !== 'paste') return;
    switch (act) {
      case 'parent':
        if (el && el.parentElement && el.parentElement !== document.body) {
          selectElement(el.parentElement);
        }
        break;
      case 'up':
        moveEl(el, 'up');
        break;
      case 'down':
        moveEl(el, 'down');
        break;
      case 'duplicate':
        duplicateEl(el);
        break;
      case 'copy':
        copySelection();
        break;
      case 'paste':
        pasteClipboard();
        break;
      case 'delete':
        deleteEl(el);
        break;
    }
  }

  function hideToolbar() {
    if (toolbar) toolbar.style.display = 'none';
  }

  // ============ DOM 操作（增删移动） ============

  function deleteEl(el) {
    if (!el) return;
    beforeChange();
    if (el.classList) {
      el.classList.remove('ed-selected');
      el.classList.remove('ed-hover');
    }
    var sibling = el.nextElementSibling || el.previousElementSibling;
    el.remove();
    hideToolbar();
    selectedId = null;
    notifySelect(null);
    // 选中相邻元素方便连续操作
    if (sibling && isEditableTarget(sibling)) selectElement(sibling);
    notifyChanged();
  }

  function duplicateEl(el) {
    if (!el) return;
    beforeChange();
    var clone = el.cloneNode(true);
    clone.removeAttribute(ID_ATTR);
    clone.classList.remove('ed-selected', 'ed-hover');
    if (el.parentNode) {
      el.parentNode.insertBefore(clone, el.nextSibling);
      assignId(clone);
      selectElement(clone);
    }
    notifyChanged();
  }

  // ============ 剪贴板复制 / 粘贴 ============
  /** 克隆并清理编辑标记，返回可入库的 outerHTML */
  function cleanCloneForClipboard(el) {
    var clone = el.cloneNode(true);
    clone.removeAttribute(ID_ATTR);
    clone.classList.remove('ed-selected', 'ed-hover', 'ed-editing');
    if (clone.getAttribute('contenteditable') === 'true') clone.removeAttribute('contenteditable');
    var desc = clone.querySelectorAll('[' + ID_ATTR + ']');
    for (var i = 0; i < desc.length; i++) {
      desc[i].removeAttribute(ID_ATTR);
      desc[i].classList.remove('ed-selected', 'ed-hover', 'ed-editing');
      if (desc[i].getAttribute('contenteditable') === 'true') desc[i].removeAttribute('contenteditable');
      if (desc[i].getAttribute('class') === '') desc[i].removeAttribute('class');
    }
    if (clone.getAttribute('class') === '') clone.removeAttribute('class');
    return clone.outerHTML;
  }

  /** 复制选中元素（支持多选）到内部剪贴板，不改动文档 */
  function copySelection() {
    var ids = selectedIds.length > 0 ? selectedIds.slice() : (selectedId ? [selectedId] : []);
    if (ids.length === 0) return;
    var htmls = [];
    for (var i = 0; i < ids.length; i++) {
      var el = findById(ids[i]);
      if (el) htmls.push(cleanCloneForClipboard(el));
    }
    if (htmls.length === 0) return;
    clipboard = htmls;
    // 剪贴板有内容后显示粘贴按钮
    if (toolbar) {
      var pasteBtn = toolbar.querySelector('[data-act="paste"]');
      if (pasteBtn) pasteBtn.style.display = '';
    }
    HOST.postMessage({ source: 'ed-editor', type: 'COPIED', payload: { count: htmls.length } }, '*');
  }

  /** 粘贴时宽度自适应：根元素限宽 100%，内部图片等比缩放不溢出模块 */
  function adaptPasted(root) {
    if (!root || root.nodeType !== 1) return;
    root.style.maxWidth = '100%';
    if (root.tagName === 'IMG') {
      root.style.height = 'auto';
    }
    var imgs = root.querySelectorAll ? root.querySelectorAll('img') : [];
    for (var i = 0; i < imgs.length; i++) {
      imgs[i].style.maxWidth = '100%';
      imgs[i].style.height = 'auto';
    }
  }

  /** 把剪贴板内容粘贴到当前选中位置：
   *  选中容器 → 追加到其内部末尾；选中非容器 → 插到其后方；无选中 → body 末尾 */
  function pasteClipboard() {
    if (clipboard.length === 0) return;
    var ref = selectedId ? findById(selectedId) : null;
    beforeChange('粘贴');
    var tpl = document.createElement('div');
    var frag = document.createDocumentFragment();
    var firstNode = null;
    for (var i = 0; i < clipboard.length; i++) {
      tpl.innerHTML = clipboard[i];
      while (tpl.firstChild) {
        var node = tpl.firstChild;
        if (node.nodeType === 1) {
          assignId(node);
          var desc = node.querySelectorAll ? node.querySelectorAll('*') : [];
          for (var d = 0; d < desc.length; d++) assignId(desc[d]);
          adaptPasted(node);
          if (!firstNode) firstNode = node;
        }
        frag.appendChild(node);
      }
    }
    if (ref && isContainer(ref)) {
      ref.appendChild(frag);
    } else if (ref && ref.parentNode) {
      ref.parentNode.insertBefore(frag, ref.nextSibling);
    } else {
      document.body.appendChild(frag);
    }
    if (firstNode) selectElement(firstNode);
    notifyChanged();
    notifyLayerTree();
  }

  function moveEl(el, dir) {
    if (!el || !el.parentNode) return;
    if (dir === 'up') {
      var prev = el.previousElementSibling;
      if (!prev) return;
      beforeChange();
      el.parentNode.insertBefore(el, prev);
    } else {
      var next = el.nextElementSibling;
      if (!next) return;
      beforeChange();
      el.parentNode.insertBefore(el, next.nextSibling);
    }
    positionToolbar(el);
    notifyChanged();
  }

  /** 在指定元素 前方/后方 插入同类元素（文字或图片） */
  function insertEl(el, where, kind) {
    if (!el) return null;
    beforeChange();
    var newNode;
    if (kind === 'image') {
      newNode = document.createElement('img');
      newNode.setAttribute('src', 'https://placehold.co/300x200/eef2ff/165dff?text=New+Image');
      newNode.setAttribute('alt', '新图片');
      // 沿用参考图片尺寸
      if (el.tagName === 'IMG' && el.getAttribute('width')) {
        newNode.setAttribute('width', el.getAttribute('width'));
        newNode.setAttribute('height', el.getAttribute('height'));
      }
    } else {
      // 文字：沿用参考元素的标签（p/h1/span/div），默认 p
      var refTag = /^(P|H1|H2|H3|H4|H5|H6|SPAN|LI|DIV|A|BUTTON|LABEL)$/.test(el.tagName)
        ? el.tagName
        : 'P';
      newNode = document.createElement(refTag);
      newNode.textContent = '新文字内容';
    }
    if (where === 'before') el.parentNode.insertBefore(newNode, el);
    else el.parentNode.insertBefore(newNode, el.nextSibling);
    assignId(newNode);
    selectElement(newNode);
    notifyChanged();
    return newNode;
  }

  // ============ G8 素材库：插入预设组件 ============
  /** 把 HTML 片段插入到选中元素的同级位置（before/after）或 body 末尾 */
  function insertComponent(html, where) {
    beforeChange('插入组件');
    var tpl = document.createElement('div');
    tpl.innerHTML = html;
    var frag = document.createDocumentFragment();
    var firstNode = null;
    while (tpl.firstChild) {
      assignId(tpl.firstChild);
      // 给所有后代也打标记，便于后续选中编辑
      var desc = tpl.firstChild.querySelectorAll ? tpl.firstChild.querySelectorAll('*') : [];
      for (var d = 0; d < desc.length; d++) assignId(desc[d]);
      if (!firstNode) firstNode = tpl.firstChild;
      frag.appendChild(tpl.firstChild);
    }
    var ref = selectedId ? findById(selectedId) : null;
    var insertedInto = null;
    if (where === 'inside' && ref) {
      // 明确指定：插入到选中元素内部末尾
      ref.appendChild(frag);
      insertedInto = ref;
    } else if (ref && isContainer(ref) && where !== 'after') {
      // 默认：选中是容器 → 插入其内部末尾（更符合"往这个区块加内容"的直觉）
      ref.appendChild(frag);
      insertedInto = ref;
    } else if (ref && ref.parentNode) {
      // 选中不是容器 → 插入到同级后方
      ref.parentNode.insertBefore(frag, ref.nextSibling);
      insertedInto = ref.parentNode;
    } else {
      document.body.appendChild(frag);
      insertedInto = document.body;
    }
    if (firstNode) selectElement(firstNode);
    notifyChanged();
    notifyLayerTree();
  }

  /** 判断元素是否为"容器"（可往内部追加内容） */
  function isContainer(el) {
    if (!el) return false;
    var tag = el.tagName;
    if (/^(SECTION|DIV|ARTICLE|ASIDE|HEADER|FOOTER|NAV|MAIN|LI|TD|TH|FIGURE|BLOCKQUOTE|UL|OL)$/.test(tag)) return true;
    return false;
  }

  // ============ G14 多选群组操作 ============
  function multiDelete() {
    if (selectedIds.length === 0) return;
    beforeChange('批量删除');
    for (var i = 0; i < selectedIds.length; i++) {
      var el = findById(selectedIds[i]);
      if (el) el.remove();
    }
    hideToolbar();
    selectedId = null;
    selectedIds = [];
    notifySelect(null);
    notifySelectMulti(); // 批量删除后隐藏"已选 N 个"悬浮条
    notifyChanged();
    notifyLayerTree();
  }
  function multiDuplicate() {
    if (selectedIds.length === 0) return;
    beforeChange('批量复制');
    var newIds = [];
    for (var i = 0; i < selectedIds.length; i++) {
      var el = findById(selectedIds[i]);
      if (!el) continue;
      var clone = el.cloneNode(true);
      clone.removeAttribute(ID_ATTR);
      clone.classList.remove('ed-selected', 'ed-hover');
      if (el.parentNode) el.parentNode.insertBefore(clone, el.nextSibling);
      assignId(clone);
      newIds.push(clone.getAttribute(ID_ATTR));
    }
    deselectAll();
    for (var k = 0; k < newIds.length; k++) {
      var n = findById(newIds[k]);
      if (n) { n.classList.add('ed-selected'); selectedIds.push(newIds[k]); }
    }
    if (newIds.length) { selectedId = newIds[newIds.length - 1]; var main = findById(selectedId); if (main) { showToolbar(main); notifySelect(buildInfo(main)); } }
    notifySelectMulti(); // 同步批量复制后的多选数量
    notifyChanged();
    notifyLayerTree();
  }

  function replaceImageSrc(id, src) {
    var el = findById(id);
    if (!el) return;
    beforeChange();
    el.setAttribute('src', src);
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  function selectParent() {
    var el = findById(selectedId);
    if (el && el.parentElement && el.parentElement !== document.body) {
      selectElement(el.parentElement);
    }
  }

  // ============ 滚动/resize 同步工具条 ============
  window.addEventListener('scroll', function () {
    if (selectedId && toolbar) {
      var el = findById(selectedId);
      if (el) positionToolbar(el);
    }
  });
  window.addEventListener('resize', function () {
    if (selectedId && toolbar) {
      var el = findById(selectedId);
      if (el) positionToolbar(el);
    }
  });

  // ============ 快捷键：iframe 内独立的撤销/重做/Delete（事件不冒泡到父窗口）============
  document.addEventListener('keydown', function (e) {
    // 正在编辑文字时，所有快捷键让浏览器原生处理（contenteditable 编辑）
    if (editingId) return;
    var mod = e.ctrlKey || e.metaKey;
    var key = e.key.toLowerCase();
    if (mod && key === 'z' && !e.shiftKey) {
      e.preventDefault();
      undo();
    } else if (mod && (key === 'y' || (key === 'z' && e.shiftKey))) {
      e.preventDefault();
      redo();
    } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
      // 删除选中元素（多选时批量删除）
      e.preventDefault();
      if (selectedIds.length > 1) multiDelete(); else deleteEl(findById(selectedId));
    } else if (mod && key === 'd' && selectedIds.length > 0) {
      // Ctrl/Cmd+D 立即克隆一份到下方（多选时批量克隆）
      e.preventDefault();
      if (selectedIds.length > 1) multiDuplicate(); else duplicateEl(findById(selectedId));
    } else if (mod && key === 'c' && selectedIds.length > 0) {
      // Ctrl/Cmd+C 复制到内部剪贴板（不动文档）
      e.preventDefault();
      copySelection();
    } else if (mod && key === 'v' && clipboard.length > 0) {
      // Ctrl/Cmd+V 粘贴到选中模块/位置
      e.preventDefault();
      pasteClipboard();
    } else if (mod && (key === '=' || key === '+')) {
      // Ctrl/Cmd + '+' 放大画布
      e.preventDefault();
      setZoom(zoomLevel + 0.1);
    } else if (mod && key === '-') {
      // Ctrl/Cmd + '-' 缩小画布
      e.preventDefault();
      setZoom(zoomLevel - 0.1);
    } else if (mod && key === '0') {
      // Ctrl/Cmd + 0 重置缩放
      e.preventDefault();
      setZoom(1);
    } else if ((e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') && selectedId) {
      // G12 方向键微移（iframe 内处理，因为 iframe 的按键不冒泡到父窗口）
      // Shift=大步10px，普通=1px；Alt+上/下=调整同级顺序
      e.preventDefault();
      if (e.altKey) {
        if (e.key === 'ArrowUp') reorderElement('up');
        else if (e.key === 'ArrowDown') reorderElement('down');
      } else {
        var step = e.shiftKey ? 10 : 1;
        var dir = e.key === 'ArrowUp' ? 'up' : e.key === 'ArrowDown' ? 'down' : e.key === 'ArrowLeft' ? 'left' : 'right';
        nudgeElement(dir, step);
      }
    } else if (e.key === 'Escape' && selectedId) {
      deselectAll();
      hideToolbar();
      notifySelect(null);
      notifySelectMulti(); // 退出多选状态，隐藏父窗口悬浮条
    }
  }, true);

  // ============ 导出：清理编辑标记，返回干净 HTML ============
  function getCleanHtml() {
    // 注意：不要调用 deselectAll()，那会清除 selectedId 导致方向键等连续操作失效。
    // 只在克隆节点上清理编辑标记，不影响实际 DOM 的选中状态。
    var cloneDoc = document.documentElement.cloneNode(true);
    // 移除注入的 script / style / 工具条 / overlay
    var injected = cloneDoc.querySelectorAll('[data-ed-injected]');
    for (var i = 0; i < injected.length; i++) injected[i].remove();
    // 移除标记属性
    var all = cloneDoc.querySelectorAll('[' + ID_ATTR + ']');
    for (var j = 0; j < all.length; j++) {
      all[j].removeAttribute(ID_ATTR);
      all[j].classList.remove('ed-hover', 'ed-selected', 'ed-editing');
      if (all[j].getAttribute('contenteditable') === 'true') all[j].removeAttribute('contenteditable');
      if (all[j].getAttribute('class') === '') all[j].removeAttribute('class');
    }
    return '<!doctype html>\n' + cloneDoc.outerHTML;
  }

  // ============ 设置元素背景图（页面头部 / 任意容器） ============
  function setBgImage(id, src) {
    var el = findById(id);
    if (!el || !src) return;
    beforeChange();
    el.style.backgroundImage = 'url("' + src + '")';
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.style.backgroundRepeat = 'no-repeat';
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  // ============ 头部/容器叠加图（PS 混合模式）============
  var OVERLAY_CLS = 'hero-overlay';
  /** 找叠加图的目标容器：当前选中的容器 → 选中元素最近的容器祖先 → 页面 .hero 区 */
  function findOverlayTarget() {
    var el = findById(selectedId);
    if (el && isContainer(el)) return el;
    if (el && el.closest) {
      var p = el.closest('section,div,header,footer,main,article');
      if (p) return p;
    }
    return document.querySelector('.hero');
  }
  function findOverlayImg(target) {
    if (!target) return null;
    for (var i = 0; i < target.children.length; i++) {
      var c = target.children[i];
      if (c.tagName === 'IMG' && c.classList.contains(OVERLAY_CLS)) return c;
    }
    return null;
  }
  /** 设置/替换叠加图（不存在则创建），并应用混合模式 */
  function setOverlayImage(src, mode) {
    var target = findOverlayTarget();
    if (!target) {
      HOST.postMessage({ source: 'ed-editor', type: 'OVERLAY_ERROR', payload: { msg: '请先选中一个容器（或页面需包含 .hero 区域）' } }, '*');
      return;
    }
    beforeChange('头部加图');
    if (window.getComputedStyle(target).position === 'static') target.style.position = 'relative';
    var ov = findOverlayImg(target);
    if (!ov) {
      ov = document.createElement('img');
      ov.className = OVERLAY_CLS;
      ov.setAttribute('aria-hidden', 'true');
      ov.style.position = 'absolute';
      ov.style.left = '0';
      ov.style.top = '0';
      ov.style.width = '100%';
      ov.style.height = '100%';
      ov.style.objectFit = 'cover';
      target.appendChild(ov);
    }
    if (src) ov.setAttribute('src', src);
    ov.style.mixBlendMode = mode || 'overlay';
    assignId(ov);
    notifyChanged();
    notifyLayerTree();
  }
  /** 实时切换混合模式（预览）：合并历史快照 + 防抖通知 */
  function setOverlayMode(mode) {
    var target = findOverlayTarget();
    var ov = findOverlayImg(target);
    if (!ov) return;
    beforeChangeCoalesced('overlay-mode', '混合模式');
    ov.style.mixBlendMode = mode;
    notifyChangedDebounced();
  }
  /** 移除叠加图（弹窗"取消"时恢复原状用） */
  function removeOverlay() {
    var target = findOverlayTarget();
    var ov = findOverlayImg(target);
    if (!ov) return;
    beforeChange('移除叠加图');
    ov.remove();
    notifyChanged();
    notifyLayerTree();
  }
  /** 回传当前叠加图状态（弹窗初始化 / 取消恢复用） */
  function getOverlayState() {
    var target = findOverlayTarget();
    var ov = findOverlayImg(target);
    HOST.postMessage({
      source: 'ed-editor', type: 'OVERLAY_STATE',
      payload: ov
        ? { has: true, src: ov.getAttribute('src') || '', mode: ov.style.mixBlendMode || 'overlay' }
        : { has: false },
    }, '*');
  }

  // ============ 文字样式（字号 / 颜色 / 模块色 / 背景色）============
  function setFontSize(id, px) {
    var el = findById(id);
    if (!el) return;
    beforeChange();
    el.style.fontSize = px + 'px';
    notifyChanged();
    notifySelect(buildInfo(el));

<script id="ed-blur-runtime">
(function(){
  "use strict";
  var BTN_ID='ed-blur-btn';
  function findIframe(){ return document.querySelector('iframe.editor-canvas')||document.querySelector('iframe'); }
  function selectedImage(){
    var ifr=findIframe(); if(!ifr||!ifr.contentDocument) return null;
    var el=ifr.contentDocument.querySelector('img.ed-selected');
    return (el&&el.tagName==='IMG')?{ifr:ifr,img:el}:null;
  }
  function norm(r){ return {x:Math.min(r.x0,r.x1),y:Math.min(r.y0,r.y1),w:Math.abs(r.x1-r.x0),h:Math.abs(r.y1-r.y0)}; }
  function openBlur(ifr,img){
    var id=img.getAttribute('data-ed-id');
    if(!id){ alert('无法定位该图片（缺少 id）'); return; }
    var src=img.getAttribute('src')||img.src;
    var im=new Image();
    im.onload=function(){ if(!im.naturalWidth){ alert('图片尺寸无效'); return;} buildModal(ifr,id,im); };
    im.onerror=function(){ alert('图片加载失败，无法模糊'); };

  }
  function buildModal(ifr,id,im){
    var nW=im.naturalWidth, nH=im.naturalHeight;
    var maxW=Math.min(window.innerWidth*0.82,1000), maxH=window.innerHeight*0.66;
    var scale=Math.min(maxW/nW, maxH/nH, 1);
    var dW=Math.max(1,Math.round(nW*scale)), dH=Math.max(1,Math.round(nH*scale));
    var ratio=nW/dW;
    var mask=document.createElement('div'); mask.className='ed-blur-mask';
    var box=document.createElement('div'); box.className='ed-blur-box';
    var head=document.createElement('div'); head.className='ed-blur-head';
    head.textContent='局部高斯模糊 — 在图上拖拽框选要模糊的区域（可画多个）';
    box.appendChild(head);
    var cwrap=document.createElement('div'); cwrap.className='ed-blur-cwrap';
    var cv=document.createElement('canvas'); cv.width=dW; cv.height=dH; cv.className='ed-blur-canvas';
    cwrap.appendChild(cv); box.appendChild(cwrap);
    var ctrl=document.createElement('div'); ctrl.className='ed-blur-ctrl';
    var lab=document.createElement('label'); lab.textContent='模糊强度：';
    var val=document.createElement('span'); val.textContent='10'; lab.appendChild(val);
    var slider=document.createElement('input'); slider.type='range'; slider.min='2'; slider.max='40'; slider.value='10'; slider.className='ed-blur-slider';
    ctrl.appendChild(lab); ctrl.appendChild(slider); box.appendChild(ctrl);
    var foot=document.createElement('div'); foot.className='ed-blur-foot';
    foot.innerHTML='<button class="btn" data-act="undo">撤销框</button><button class="btn" data-act="clear">清空</button><span style="flex:1"></span><button class="btn" data-act="cancel">取消</button><button class="btn btn-primary" data-act="apply">应用</button>';
    box.appendChild(foot);
    mask.appendChild(box); document.body.appendChild(mask);
    var ctx=cv.getContext('2d');
    var rects=[], drag=null;
    function radius(){ return parseInt(slider.value,10)||10; }
    function redraw(){
      ctx.filter='none'; ctx.clearRect(0,0,dW,dH); ctx.drawImage(im,0,0,dW,dH);
      rects.concat(drag?[drag]:[]).forEach(function(r){
        var rr=norm(r); if(rr.w<1||rr.h<1) return;
        ctx.save(); ctx.beginPath(); ctx.rect(rr.x,rr.y,rr.w,rr.h); ctx.clip();
        ctx.filter='blur('+radius()+'px)'; ctx.drawImage(im,0,0,dW,dH); ctx.restore();
        ctx.save(); ctx.filter='none'; ctx.strokeStyle='#165dff'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
        ctx.strokeRect(rr.x,rr.y,rr.w,rr.h); ctx.restore();
      });
    }
    function pos(e){ var b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)*(dW/b.width), y:(e.clientY-b.top)*(dH/b.height)}; }
    cv.addEventListener('mousedown',function(e){ e.preventDefault(); var p=pos(e); drag={x0:p.x,y0:p.y,x1:p.x,y1:p.y}; });
    function mm(e){ if(!drag)return; var p=pos(e); drag.x1=p.x; drag.y1=p.y; redraw(); }
    function mu(){ if(!drag)return; var rr=norm(drag); if(rr.w>4&&rr.h>4) rects.push(drag); drag=null; redraw(); }
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
    slider.addEventListener('input',function(){ val.textContent=slider.value; redraw(); });
    function close(){ window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); mask.remove(); }
    mask.addEventListener('mousedown',function(e){ if(e.target===mask) close(); });
    foot.addEventListener('click',function(e){
      var act=e.target.getAttribute&&e.target.getAttribute('data-act'); if(!act)return;
      if(act==='undo'){ rects.pop(); redraw(); }

      else if(act==='apply'){ apply(); }
    });
    function apply(){
      if(!rects.length){ close(); return; }
      var out=document.createElement('canvas'); out.width=nW; out.height=nH;
      var o=out.getContext('2d'); o.filter='none'; o.drawImage(im,0,0,nW,nH);
      rects.forEach(function(r){
        var rr=norm(r);
        o.save(); o.beginPath(); o.rect(rr.x*ratio,rr.y*ratio,rr.w*ratio,rr.h*ratio); o.clip();
        o.filter='blur('+(radius()*ratio)+'px)'; o.drawImage(im,0,0,nW,nH); o.restore();
      });

      try{ data=out.toDataURL('image/png'); }
      catch(err){ alert('该图片受跨域限制无法处理（外链图片）。请改用本地/内联图片。'); return; }

      ifr.contentWindow.postMessage({source:'ed-host',type:'REPLACE_IMAGE',payload:{id:id,src:data}},'*');
      close();
    }
    redraw();
  }
  function ensureBtn(){
    var right=document.querySelector('.toolbar-right');
    if(!right||document.getElementById(BTN_ID)) return;
    var b=document.createElement('button'); b.id=BTN_ID; b.type='button'; b.className='btn';
    b.textContent='局部模糊'; b.title='给选中图片的某个区域加高斯模糊';
    b.addEventListener('click',function(){

    });

    if(primary) right.insertBefore(b,primary); else right.appendChild(b);
  }
  function start(){ ensureBtn(); new MutationObserver(ensureBtn).observe(document.body,{childList:true,subtree:true}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>

<script id="ed-slice-runtime">
(function(){
  "use strict";
  var BTN_ID='ed-slice-btn';
  var SIZE_LIMIT=1.9*1024*1024; // 编码上限（留余量，确保每片 < 2MB）
  var PV_W=620;                 // 预览区宽度
  var big=null;                 // 整页渲染出的大 canvas
  var devScale=1;               // html2canvas 倍率（设备像素/CSS 像素）
  var cssW=0, cssH=0;           // 页面尺寸（CSS 像素，整数）
  var cuts=[];                  // 分割线 y 坐标（CSS 像素整数，升序，避免半像素）
  var previewScale=1;           // CSS 像素 → 预览像素
  var manualMode=false;         // 手动拉线模式
  var maskEl=null, pvCanvas=null, rulerCanvas=null, pvwrap=null, linesBox=null, statusEl=null;
  var sizeCache={};

  function H(){ return window.__edH2C; }
  function findIframe(){ return document.querySelector('iframe.editor-canvas')||document.querySelector('.editor-canvas')||document.querySelector('iframe'); }
  function fileBase(){
    var fn=document.querySelector('.file-name');
    return ((fn&&fn.textContent)||'export').replace(/\.html?$/i,'')||'export';
  }
  function toBlobP(cv,type,q){ return new Promise(function(res){ cv.toBlob(res,type,q); }); }
  function fmtSize(n){ return n>=1024*1024 ? (n/1024/1024).toFixed(2)+'MB' : Math.round(n/1024)+'KB'; }
  function setStatus(t){ if(statusEl) statusEl.textContent=t; }

  // ---- 整页渲染（与"导出图片"同款预处理：hero 叠加层拍平、视频换海报）----
  function renderFull(){
    var ifr=findIframe(), poster=H().getPoster(ifr);
    if(!ifr||!poster) return Promise.reject(new Error('请先加载或编辑一个页面再切图'));
    var restore=null, vrestore=null, scaleUsed=1;
    return H().ensureH2C(ifr).then(function(win){
      return H().flattenHeroOverlay(ifr.contentDocument).then(function(rf){
        restore=rf;
        vrestore=H().swapVideosForPosters(ifr.contentDocument);
        var h=poster.scrollHeight, s=Math.min(2,Math.max(0.3,32000/h));
        scaleUsed=s;
        return win.html2canvas(poster,{scale:s,backgroundColor:'#dcedff',useCORS:true,logging:false,
          windowWidth:poster.scrollWidth, windowHeight:h,
          ignoreElements:function(el){ return el.hasAttribute&&el.hasAttribute('data-ed-injected'); },
          onclone:function(d){ var ns=d.querySelectorAll('.ed-hover,.ed-selected,.ed-editing');
            for(var i=0;i<ns.length;i++){ ns[i].classList.remove('ed-hover','ed-selected','ed-editing'); ns[i].removeAttribute('contenteditable'); } }
        });
      });
    }).then(function(c){
      if(vrestore)vrestore(); if(restore)restore();
      return { canvas: c, scale: scaleUsed };
    }, function(e){ if(vrestore)vrestore(); if(restore)restore(); throw e; });
  }

  // ---- 空白行检测：某行与上一行几乎一致 → 可安全切割（自然避开文字/图片/色块边界）----
  function blankRows(cv){
    var ctx=cv.getContext('2d'), w=cv.width, h=cv.height;
    var data=ctx.getImageData(0,0,w,h).data;
    var blank=new Uint8Array(h); blank[0]=1;
    for(var y=1;y<h;y++){
      var off=y*w*4, po=(y-1)*w*4, diff=0, samples=0;
      for(var x=0;x<w;x+=8){
        var i=off+x*4, j=po+x*4;
        if(Math.abs(data[i]-data[j])>8||Math.abs(data[i+1]-data[j+1])>8||Math.abs(data[i+2]-data[j+2])>8) diff++;
        samples++;
      }
      blank[y]= diff/samples<0.01 ? 1:0;
    }
    return blank;
  }
  // 连续空白段（>=4px）的中点作为候选切割位（换算成整数 CSS 像素，避免半像素）
  function cutCandidates(blank,h){
    var cands=[],run=0,start=0;
    for(var y=0;y<h;y++){
      if(blank[y]){ if(!run) start=y; run++; }
      else { if(run>=4) cands.push(Math.round((start+y-1)/2/devScale)); run=0; }
    }
    if(run>=4) cands.push(Math.round((start+h-1)/2/devScale));
    return cands.filter(function(y){ return y>10&&y<cssH-10; });
  }
  function nearestCand(y0,y1,cands){
    var mid=(y0+y1)/2, best=null, bd=1e9;
    for(var i=0;i<cands.length;i++){
      var y=cands[i];
      if(y>y0+10&&y<y1-10){ var d=Math.abs(y-mid); if(d<bd){ bd=d; best=y; } }
    }
    return best;
  }

  // ---- 切片编码：PNG 优先；超 2MB 自动转 JPEG 递降质量 ----
  // 入参 y0/y1 为整数 CSS 像素，换算到设备像素后切割（不产生半像素）
  function sliceCanvas(cv,y0,y1){
    var dy0=Math.round(y0*devScale), dy1=Math.round(y1*devScale);
    var c=document.createElement('canvas');
    c.width=cv.width; c.height=Math.max(1,dy1-dy0);
    c.getContext('2d').drawImage(cv,0,dy0,cv.width,dy1-dy0,0,0,cv.width,dy1-dy0);
    return c;
  }
  function encodeSlice(cv){
    return toBlobP(cv,'image/png').then(function(b){
      if(b.size<=SIZE_LIMIT) return {blob:b,ext:'png'};
      var q=0.92;
      function tryQ(){
        return toBlobP(cv,'image/jpeg',q).then(function(j){
          if(j.size<=SIZE_LIMIT||q<=0.6) return {blob:j,ext:'jpg'};
          q-=0.1; return tryQ();
        });
      }
      return tryQ();
    });
  }
  function segSize(y0,y1){
    // 分析/预览用 PNG 体积：优先在空白处拆到每片 PNG < 2MB（保住文字清晰度），
    // JPEG 仅作为"无法再拆却仍超限"时的兜底（见 encodeSlice）
    var key=y0+'-'+y1;
    if(!sizeCache[key]) sizeCache[key]=toBlobP(sliceCanvas(big,y0,y1),'image/png').then(function(b){ return b.size; });
    return sizeCache[key];
  }

  // ---- 自动分析：编码验证每片大小，超限的段在最接近中点的空白处继续拆分（CSS 像素坐标）----
  async function autoAnalyze(){
    var blank=blankRows(big), cands=cutCandidates(blank,big.height);
    var segs=[[0,cssH]];
    for(var iter=0;iter<40;iter++){
      var overIdx=-1;
      for(var i=0;i<segs.length;i++){
        var sz=await segSize(segs[i][0],segs[i][1]);
        if(sz>SIZE_LIMIT){ overIdx=i; break; }
      }

    return segs;
  }

  // ---- 预览、PS 标尺与分割线 ----
  function drawPreview(){
    previewScale=PV_W/cssW;
    pvCanvas.width=PV_W;
    pvCanvas.height=Math.round(cssH*previewScale);
    pvCanvas.getContext('2d').drawImage(big,0,0,pvCanvas.width,pvCanvas.height);
    drawRuler();
    drawLines();
  }
  // PS 式标尺：左侧竖向刻度（CSS 像素），随内容滚动
  function drawRuler(){
    var h=pvCanvas.height;

      x.lineTo(43,py);
      if(isMajor&&y>0) x.fillText(String(y),27,py+3);
    }
    x.stroke();
  }
  function drawLines(){
    linesBox.innerHTML='';
    cuts.slice().sort(function(a,b){return a-b;}).forEach(function(y,idx){
      var line=document.createElement('div');
      line.className='ed-slice-line';
      line.style.width='100%';
      line.style.top=Math.round(y*previewScale)+'px';
      line.innerHTML='<span class="ed-slice-tag">切点 '+(idx+1)+' · '+y+'px（双击删除）</span>';
      line.addEventListener('dblclick',function(e){ e.stopPropagation(); cuts.splice(cuts.indexOf(y),1); drawLines(); refreshStatus(); });
      line.addEventListener('mousedown',function(e){
        e.preventDefault(); e.stopPropagation();
        var wrapRect=linesBox.getBoundingClientRect();
        var tag=line.querySelector('.ed-slice-tag');
        function mm(ev){
          var ny=Math.round((ev.clientY-wrapRect.top)/previewScale);
          ny=Math.max(10,Math.min(cssH-10,ny));
          cuts[cuts.indexOf(y)]=ny; y=ny;
          line.style.top=Math.round(ny*previewScale)+'px';
          if(tag) tag.textContent='切点 '+(idx+1)+' · '+ny+'px（双击删除）';
        }
        function mu(){ window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); refreshStatus(); }
        window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
      });
      linesBox.appendChild(line);
    });
  }
  function segmentsFromCuts(){
    var ys=cuts.slice().sort(function(a,b){return a-b;});
    var segs=[],prev=0;
    ys.forEach(function(y){ if(y-prev>=10) { segs.push([prev,y]); prev=y; } });
    if(cssH-prev>=10) segs.push([prev,cssH]);
    return segs;
  }
  async function refreshStatus(){
    if(!big) return;
    var segs=segmentsFromCuts();
    if(!segs.length){ setStatus('整页 '+cssW+'×'+cssH+'px'); return; }
    var sizes=[];
    for(var i=0;i<segs.length;i++) sizes.push(fmtSize(await segSize(segs[i][0],segs[i][1])));
    setStatus(segs.length+' 片：'+sizes.join(' / '));
  }

  // ---- 一键导出 ----
  function dl(blob,name){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
  }
  async function exportSlices(btn){
    var segs=segmentsFromCuts();
    if(!segs.length){ alert('没有可导出的切片'); return; }
    btn.disabled=true;
    var base=fileBase(), over=[];
    try{
      for(var i=0;i<segs.length;i++){
        if(!big) break; // 导出途中弹窗被关闭，直接中止
        setStatus('正在编码第 '+(i+1)+'/'+segs.length+' 片…');
        var r=await encodeSlice(sliceCanvas(big,segs[i][0],segs[i][1]));
        if(r.blob.size>SIZE_LIMIT) over.push(i+1);
        var name=base+'-切图-'+String(i+1).padStart(2,'0')+'.'+r.ext;
        dl(r.blob,name);
        await new Promise(function(res){ setTimeout(res,350); });
      }
      setStatus('已导出 '+segs.length+' 片'+(over.length?'（第 '+over.join(',')+' 片仍超 2MB，建议在该段中间再加一条分割线）':'，全部小于 2MB ✓'));
    } finally { btn.disabled=false; }
  }

  // ---- 打包下载 ZIP（惰性注入内嵌的 JSZip，父页运行）----
  function ensureJSZip(){
    if(window.JSZip) return Promise.resolve(window.JSZip);
    var src=document.getElementById('ed-jszip-src');
    if(!src||!src.textContent) return Promise.reject(new Error('压缩库源码缺失'));
    return new Promise(function(resolve,reject){
      try{
        var s=document.createElement('script');
        s.textContent=src.textContent;
        document.head.appendChild(s);
        setTimeout(function(){
          window.JSZip?resolve(window.JSZip):reject(new Error('JSZip 加载失败'));
        },30);
      }catch(e){ reject(e); }
    });
  }
  // 打包导出：全部无损 PNG，压缩成一个 zip 一次性下载
  async function exportSlicesZip(btn){
    var segs=segmentsFromCuts();
    if(!segs.length){ alert('没有可导出的切片'); return; }
    btn.disabled=true;
    var base=fileBase();
    try{
      setStatus('正在加载压缩库…');
      await ensureJSZip();
      var zip=new window.JSZip();
      for(var i=0;i<segs.length;i++){
        if(!big) break; // 导出途中弹窗被关闭，直接中止
        setStatus('正在编码第 '+(i+1)+'/'+segs.length+' 片…');
        // zip 内单文件不受浏览器 2MB 下载限制，统一无损 PNG（不走 encodeSlice 的 JPEG 降级）
        var blob=await toBlobP(sliceCanvas(big,segs[i][0],segs[i][1]),'image/png');
        zip.file(base+'-切图-'+String(i+1).padStart(2,'0')+'.png', blob);
      }
      if(!big) return; // 中止
      setStatus('正在压缩打包…（共 '+segs.length+' 片）');
      var zipBlob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
      dl(zipBlob, base+'-切图.zip');
      setStatus('已打包导出 '+segs.length+' 片 ZIP ✓（全部无损 PNG）');
    }catch(err){
      setStatus('打包失败：'+((err&&err.message)||err));
    } finally { btn.disabled=false; }
  }

  // ---- 弹窗 ----
  function closeSlice(){ if(maskEl){ maskEl.remove(); maskEl=null; } big=null; cuts=[]; sizeCache={}; manualMode=false; }
  function openSlice(){
    if(maskEl) return;
    if(!H()){ alert('渲染模块未就绪'); return; }
    maskEl=document.createElement('div'); maskEl.className='ed-slice-mask';
    maskEl.innerHTML='<div class="ed-slice-box">'
      +'<div class="ed-slice-head"><span>✂️ 切图（长图切片导出）</span><button class="ed-slice-close">✕</button></div>'
      +'<div class="ed-slice-tools">'
      +'<span class="ed-slice-status">正在渲染整页预览…</span>'
      +'<button class="ed-s-btn" data-act="auto" disabled>自动分析切图</button>'
      +'<button class="ed-s-btn" data-act="manual" disabled>➕ 手动拉线</button>'
      +'<button class="ed-s-btn" data-act="clear" disabled>清空分割线</button>'
      +'<button class="ed-s-btn ed-s-primary" data-act="export" disabled>一键导出切片</button>'
      +'<button class="ed-s-btn ed-s-primary" data-act="export-zip" disabled>📦 打包下载 ZIP</button>'
      +'</div>'
      +'<div class="ed-slice-tip">自动分析：避开文字/图片找空白处切，保证每片小于 2MB，切点取整像素。<br>手动：点「➕ 手动拉线」后在预览图上点击添加分割线，拖动调整，双击删除。左侧标尺为页面像素刻度。</div>'
      +'<div class="ed-slice-pwrap"><canvas class="ed-slice-ruler"></canvas><div class="ed-slice-pvwrap"><canvas class="ed-slice-pv"></canvas><div class="ed-slice-lines"></div></div></div>'
      +'</div>';
    document.body.appendChild(maskEl);
    pvCanvas=maskEl.querySelector('.ed-slice-pv');
    rulerCanvas=maskEl.querySelector('.ed-slice-ruler');
    pvwrap=maskEl.querySelector('.ed-slice-pvwrap');
    linesBox=maskEl.querySelector('.ed-slice-lines');
    statusEl=maskEl.querySelector('.ed-slice-status');
    maskEl.querySelector('.ed-slice-close').addEventListener('click',closeSlice);
    maskEl.addEventListener('mousedown',function(e){ if(e.target===maskEl) closeSlice(); });
    var autoBtn=maskEl.querySelector('[data-act="auto"]');
    var manualBtn=maskEl.querySelector('[data-act="manual"]');
    var clearBtn=maskEl.querySelector('[data-act="clear"]');
    var exportBtn=maskEl.querySelector('[data-act="export"]');
    var exportZipBtn=maskEl.querySelector('[data-act="export-zip"]');
    autoBtn.addEventListener('click',function(){
      if(!big) return;
      autoBtn.disabled=true; setStatus('正在分析最佳切点…');
      autoAnalyze().then(function(segs){
        cuts=segs.slice(1).map(function(s){ return s[0]; });
        drawLines();
        return refreshStatus();
      }).finally(function(){ autoBtn.disabled=false; });
    });
    manualBtn.addEventListener('click',function(){
      manualMode=!manualMode;
      pvwrap.classList.toggle('manual',manualMode);
      manualBtn.classList.toggle('ed-s-primary',manualMode);
      if(manualMode) setStatus('手动拉线中：点击预览图添加分割线（拖动调整，双击删除），再点一次退出');
      else refreshStatus();
    });
    clearBtn.addEventListener('click',function(){ cuts=[]; drawLines(); refreshStatus(); });
    exportBtn.addEventListener('click',function(){ exportSlices(exportBtn); });
    exportZipBtn.addEventListener('click',function(){ exportSlicesZip(exportZipBtn); });
    // 手动模式：点击预览添加分割线（整数 CSS 像素）
    pvCanvas.addEventListener('click',function(e){
      if(!big||!manualMode) return;
      var r=pvCanvas.getBoundingClientRect();
      var y=Math.round((e.clientY-r.top)/previewScale);
      if(y>10&&y<cssH-10){ cuts.push(y); drawLines(); refreshStatus(); }
    });
    renderFull().then(function(r){
      big=r.canvas;
      devScale=r.scale||1;
      cssW=Math.round(big.width/devScale);
      cssH=Math.round(big.height/devScale);
      drawPreview();
      autoBtn.disabled=false; manualBtn.disabled=false; clearBtn.disabled=false; exportBtn.disabled=false; exportZipBtn.disabled=false;
      setStatus('整页渲染完成（'+cssW+'×'+cssH+'px）。点「自动分析切图」或「➕ 手动拉线」。');
    }).catch(function(e){ setStatus('渲染失败：'+((e&&e.message)||e)); });
  }

  function ensureBtn(){
    var right=document.querySelector('.toolbar-right');
    if(!right||document.getElementById(BTN_ID)) return;
    var b=document.createElement('button');
    b.id=BTN_ID; b.type='button'; b.className='btn';
    b.textContent='✂️ 切图'; b.title='把长图切成多片导出（自动避开图文、每片小于 2MB，也支持手动拉线）';
    b.addEventListener('click',openSlice);
    var primary=right.querySelector('.btn-primary');
    if(primary) right.insertBefore(b,primary); else right.appendChild(b);
  }
  function start(){ ensureBtn(); new MutationObserver(ensureBtn).observe(document.body,{childList:true,subtree:true}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>

<script data-ed-extra="1">
(function () {
  'use strict';
  // ============ 工具函数 ============
  function getIframe() {
    return document.querySelector('iframe.editor-canvas') || document.querySelector('.editor-canvas');
  }
  function postToIframe(msg) {
    var ifr = getIframe();
    if (ifr && ifr.contentWindow) ifr.contentWindow.postMessage(msg, '*');
  }
  function ensureToolbarRight() {
    return document.querySelector('.toolbar-right');
  }
  // 创建弹窗（模态）
  function openModal(title, bodyNode, opts) {
    opts = opts || {};
    closeModal();
    var mask = document.createElement('div');
    mask.className = 'dialog-mask ed-extra-mask';
    mask.addEventListener('mousedown', function (e) { if (e.target === mask) closeModal(); });
    var dlg = document.createElement('div');
    dlg.className = 'dialog' + (opts.size === 'lg' ? ' dialog-lg' : (opts.size === 'sm' ? ' dialog-sm' : ''));
    dlg.style.minWidth = '420px';
    var head = document.createElement('div');
    head.className = 'dialog-header';
    var h3 = document.createElement('h3'); h3.textContent = title;
    var closeBtn = document.createElement('button'); closeBtn.className = 'dialog-close'; closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', closeModal);
    head.appendChild(h3); head.appendChild(closeBtn);
    var body = document.createElement('div'); body.className = 'dialog-body';
    if (typeof bodyNode === 'string') body.innerHTML = bodyNode; else body.appendChild(bodyNode);
    var foot = document.createElement('div'); foot.className = 'dialog-footer';
    if (opts.footer) { if (typeof opts.footer === 'string') foot.innerHTML = opts.footer; else foot.appendChild(opts.footer); }
    else { var b = document.createElement('button'); b.className = 'btn'; b.textContent = '关闭'; b.addEventListener('click', closeModal); foot.appendChild(b); }
    dlg.appendChild(head); dlg.appendChild(body); if (!opts.noFooter) dlg.appendChild(foot);
    mask.appendChild(dlg);
    document.body.appendChild(mask);
    return { mask: mask, dlg: dlg, body: body, foot: foot };
  }
  function closeModal() {
    var m = document.querySelector('.ed-extra-mask');
    if (m) m.remove();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  // ============ G12 方向键微移（父窗口监听，转发给 iframe，不依赖 iframe 焦点）============
  document.addEventListener('keydown', function (e) {
    // 正在输入框/文本域/可编辑元素中不拦截
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    // 有弹窗时不处理
    if (document.querySelector('.ed-extra-mask') || document.querySelector('.dialog-mask')) return;
    var key = e.key;
    if (key === 'Escape') {
      // 焦点在父窗口时 iframe 收不到按键，转发 Esc 取消选中/多选（隐藏"已选 N 个"悬浮条）
      postToIframe({ source: 'ed-host', type: 'DESELECT' });
      return;
    }
    // Ctrl/Cmd + '+'/'-'/'0' 缩放画布（preventDefault 避免触发浏览器自身缩放）
    if (e.ctrlKey || e.metaKey) {
      if (key === '=' || key === '+') { e.preventDefault(); postToIframe({ source: 'ed-host', type: 'ZOOM_IN' }); return; }
      if (key === '-') { e.preventDefault(); postToIframe({ source: 'ed-host', type: 'ZOOM_OUT' }); return; }
      if (key === '0') { e.preventDefault(); postToIframe({ source: 'ed-host', type: 'ZOOM_RESET' }); return; }
    }
    if (key !== 'ArrowUp' && key !== 'ArrowDown' && key !== 'ArrowLeft' && key !== 'ArrowRight') return;
    e.preventDefault();
    if (e.altKey) {
      // Alt + 上/下 = 调整同级顺序
      if (key === 'ArrowUp') postToIframe({ source: 'ed-host', type: 'REORDER', payload: { dir: 'up' } });
      else if (key === 'ArrowDown') postToIframe({ source: 'ed-host', type: 'REORDER', payload: { dir: 'down' } });
    } else {
      // 普通方向键 = 像素微移；Shift = 大步 10px
      var step = e.shiftKey ? 10 : 1;
      var dir = key === 'ArrowUp' ? 'up' : key === 'ArrowDown' ? 'down' : key === 'ArrowLeft' ? 'left' : 'right';
      postToIframe({ source: 'ed-host', type: 'NUDGE', payload: { dir: dir, step: step } });
    }
  });

  // ============ G7 标尺与网格切换 ============
  var gridOn = false;
  function ensureGridBtn() {
    var right = ensureToolbarRight(); if (!right) return;
    if (document.getElementById('ed-grid-btn')) return;
    var b = document.createElement('button');
    b.id = 'ed-grid-btn'; b.type = 'button'; b.className = 'btn'; b.textContent = '📐 网格';
    b.title = '显示/隐藏对齐网格（可调大小）';
    b.addEventListener('click', function () {
      gridOn = !gridOn;
      postToIframe({ source: 'ed-host', type: 'TOGGLE_GRID' });
      b.classList.toggle('btn-primary', gridOn);
    });
    // 长按 / 右键 弹出尺寸选择
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); openGridSize(b); });
    right.insertBefore(b, right.firstChild);
  }
  function openGridSize(btn) {
    var box = document.createElement('div');
    var sizes = [10, 20, 40, 50, 80, 100, 120];
    box.innerHTML = '<p style="font-size:12px;color:var(--text-tertiary);margin:0 0 12px">选择网格大小（像素），切换显示用「网格」按钮</p>';
    var group = document.createElement('div');
    group.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
    sizes.forEach(function (sz) {
      var g = document.createElement('button');
      g.className = 'btn'; g.style.cssText = 'min-width:56px;justify-content:center';
      g.textContent = sz + 'px';
      g.addEventListener('click', function () {
        postToIframe({ source: 'ed-host', type: 'SET_GRID_SIZE', payload: { size: sz } });
        if (!gridOn) { gridOn = true; postToIframe({ source: 'ed-host', type: 'TOGGLE_GRID' }); if (btn) btn.classList.add('btn-primary'); }
        closeModal();
      });
      group.appendChild(g);
    });
    var customRow = document.createElement('div');
    customRow.style.cssText = 'display:flex;gap:6px;align-items:center;margin-top:12px';
    customRow.innerHTML = '<span style="font-size:12px;color:var(--text-secondary)">自定义</span>';
    var inp = document.createElement('input');
    inp.type = 'number'; inp.className = 'input'; inp.style.width = '80px'; inp.value = '50'; inp.min = '4'; inp.max = '500';
    var apply = document.createElement('button');
    apply.className = 'btn btn-primary'; apply.textContent = '应用';
    apply.addEventListener('click', function () {
      var v = parseInt(inp.value, 10);
      if (v >= 4 && v <= 500) {
        postToIframe({ source: 'ed-host', type: 'SET_GRID_SIZE', payload: { size: v } });
        if (!gridOn) { gridOn = true; postToIframe({ source: 'ed-host', type: 'TOGGLE_GRID' }); if (btn) btn.classList.add('btn-primary'); }
        closeModal();
      }
    });
    customRow.appendChild(inp); customRow.appendChild(apply);
    box.appendChild(group); box.appendChild(customRow);
    openModal('网格大小', box, { size: 'sm' });
  }

  // ============ G4 历史可视化 ============
  var historyList = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.source === 'ed-editor' && d.type === 'HISTORY' && d.list) historyList = d.list;
  });
  function openHistory() {
    postToIframe({ source: 'ed-host', type: 'GET_HTML' }); // 触发一次同步
    var box = document.createElement('div');
    box.style.cssText = 'max-height:50vh;overflow:auto';
    if (!historyList.length) { box.textContent = '暂无历史记录'; }
    historyList.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'ed-hist-row' + (item.current ? ' ed-hist-cur' : '');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;' + (item.current ? 'background:var(--accent-bg);color:var(--accent);font-weight:600;' : 'border:1px solid var(--border);margin-bottom:6px;');
      row.innerHTML = '<span style="color:var(--text-tertiary);font-size:11px;width:24px">#' + item.idx + '</span><span>' + item.label + '</span>' + (item.current ? '<span style="margin-left:auto">●</span>' : '');
      row.addEventListener('click', function () {
        postToIframe({ source: 'ed-host', type: 'GOTO_HISTORY', payload: { target: item.idx } });
        closeModal();
      });
      box.appendChild(row);
    });
    var tip = document.createElement('p');
    tip.style.cssText = 'font-size:12px;color:var(--text-tertiary);margin:0 0 10px';
    tip.textContent = '点击任意步骤可跳转到该历史状态';
    var wrap = document.createElement('div');
    wrap.appendChild(tip); wrap.appendChild(box);
    openModal('历史步骤 (' + historyList.length + ')', wrap, { noFooter: true });
  }
  function ensureHistoryBtn() {
    var right = ensureToolbarRight(); if (!right) return;
    if (document.getElementById('ed-history-btn')) return;
    var b = document.createElement('button');
    b.id = 'ed-history-btn'; b.type = 'button'; b.className = 'btn'; b.textContent = '📜 历史';
    b.title = '历史步骤可视化';
    b.addEventListener('click', openHistory);
    right.insertBefore(b, right.firstChild);
  }

  // ============ G8 素材库 ============
  // 空白框架（可嵌套容器）—— 横列/竖列/网格自适应
  var FRAMES = [
    { name: '横列框架', desc: '子元素横向自适应排列', icon: '⬌',
      html: '<div data-ed-frame="row" style="display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;padding:16px;border:1px dashed #c9cdd4;border-radius:8px;background:#fafbfc;min-height:60px"><div style="flex:1 1 120px;padding:12px;background:#fff;border-radius:6px;font-size:13px;color:#86909c;text-align:center">横列内容块 A</div><div style="flex:1 1 120px;padding:12px;background:#fff;border-radius:6px;font-size:13px;color:#86909c;text-align:center">横列内容块 B</div></div>' },
    { name: '竖列框架', desc: '子元素纵向自适应排列', icon: '⬍',
      html: '<div data-ed-frame="col" style="display:flex;flex-direction:column;gap:12px;padding:16px;border:1px dashed #c9cdd4;border-radius:8px;background:#fafbfc;min-height:60px"><div style="padding:12px;background:#fff;border-radius:6px;font-size:13px;color:#86909c">竖列内容块 1</div><div style="padding:12px;background:#fff;border-radius:6px;font-size:13px;color:#86909c">竖列内容块 2</div></div>' },
    { name: '空白容器', desc: '自适应空白区域，可往里拖入任意素材', icon: '▢',
      html: '<div data-ed-frame="box" style="padding:20px;border:1px dashed #c9cdd4;border-radius:8px;background:#fafbfc;min-height:80px;font-size:13px;color:#86909c;text-align:center">空白容器：选中我，再插入素材会放到这里</div>' },
    { name: '两栏网格', desc: '等宽两栏自适应', icon: '◫',

      b.addEventListener('click', function () {
        curMode = m[0];
        modesBox.querySelectorAll('.btn').forEach(function (x) { x.classList.remove('btn-primary'); });
        b.classList.add('btn-primary');
        postToIframe({ source: 'ed-host', type: 'SET_OVERLAY_MODE', payload: { mode: m[0] } });
      });
      modesBox.appendChild(b);
    });
    box.querySelector('.ed-ov-file').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        postToIframe({ source: 'ed-host', type: 'SET_OVERLAY_IMAGE', payload: { src: String(rd.result), mode: curMode } });
      };
      rd.readAsDataURL(f);
    });
    var foot = document.createElement('div');
    foot.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;width:100%';
    var cancel = document.createElement('button');
    cancel.className = 'btn'; cancel.textContent = '取消并还原';
    cancel.addEventListener('click', function () {
      if (overlayOrig && overlayOrig.has) {
        postToIframe({ source: 'ed-host', type: 'SET_OVERLAY_IMAGE', payload: { src: overlayOrig.src, mode: overlayOrig.mode } });
      } else {
        postToIframe({ source: 'ed-host', type: 'REMOVE_OVERLAY' });
      }
      closeModal();
    });
    var ok = document.createElement('button');
    ok.className = 'btn btn-primary'; ok.textContent = '完成';
    ok.addEventListener('click', closeModal);
    foot.appendChild(cancel); foot.appendChild(ok);
    openModal('头部加图 / 图层混合模式', box, { footer: foot });
  }
  function ensureOverlayBtn() {
    var right = ensureToolbarRight(); if (!right) return;
    if (document.getElementById('ed-overlay-btn')) return;
    var b = document.createElement('button');
    b.id = 'ed-overlay-btn'; b.type = 'button'; b.className = 'btn'; b.textContent = '🖼 头部加图';
    b.title = '给头部/容器叠加图片并选择图层混合模式';
    b.addEventListener('click', openOverlayModal);
    right.insertBefore(b, right.firstChild);
  }

  // ============ 画布内左键点击 → 关闭右键菜单 ============
  // 菜单（React）靠父文档的 mousedown 监听实现"点外部关闭"，但 iframe 内的点击
  // 冒泡不到父文档。这里收到画布的左键通知后，代为派发一个 mousedown 触发其关闭。
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'ed-editor' || d.type !== 'CANVAS_CLICK') return;
    if (!document.querySelector('.ctx-menu')) return;
    document.body.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
  });

  // ============ 画布缩放控件 ============
  var zoomLevelUi = 1;
  var zoomLabel = null;
  function renderZoom() {
    if (zoomLabel) zoomLabel.textContent = Math.round(zoomLevelUi * 100) + '%';
  }
  function ensureZoomCtrl() {
    var right = ensureToolbarRight(); if (!right) return;
    if (document.getElementById('ed-zoom-out')) return;
    function mk(id, text, title, fn) {
      var b = document.createElement('button');
      b.id = id; b.type = 'button'; b.className = 'btn'; b.textContent = text; b.title = title;
      b.style.padding = '6px 8px';
      b.addEventListener('click', fn);
      return b;
    }
    var out = mk('ed-zoom-out', '🔍−', '缩小画布（Ctrl/Cmd + -）', function () { postToIframe({ source: 'ed-host', type: 'ZOOM_OUT' }); });
    zoomLabel = mk('ed-zoom-label', '100%', '重置为 100%（Ctrl/Cmd + 0）', function () { postToIframe({ source: 'ed-host', type: 'ZOOM_RESET' }); });
    zoomLabel.style.minWidth = '52px';
    zoomLabel.style.justifyContent = 'center';
    var inp = mk('ed-zoom-in', '🔍＋', '放大画布（Ctrl/Cmd + +）', function () { postToIframe({ source: 'ed-host', type: 'ZOOM_IN' }); });
    right.insertBefore(inp, right.firstChild);
    right.insertBefore(zoomLabel, right.firstChild);
    right.insertBefore(out, right.firstChild);
    renderZoom();
  }
  // 缩放值同步：iframe 内快捷键/外部按钮都会回发 ZOOM；加载新文档（READY）重置为 100%
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'ed-editor') return;
    if (d.type === 'ZOOM') { zoomLevelUi = d.payload.level; renderZoom(); }
    else if (d.type === 'READY') { zoomLevelUi = 1; renderZoom(); }
  });

  // ============ 监听 BATCH_RESULT ============
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.source === 'ed-editor' && d.type === 'BATCH_RESULT') {
      closeModal();
      var tip = document.createElement('div');
      tip.style.cssText = 'text-align:center;padding:20px;color:var(--text-primary)';
      tip.textContent = '✓ 已替换 ' + d.payload.count + ' 处';
      openModal('替换完成', tip, { noFooter: false });
    }
  });

  // ============ 初始化 ============
  function start() {
    ensureGridBtn();
    ensureHistoryBtn();
    ensureLibraryBtn();
    ensureBatchBtn();
    ensureLayerBtn();
    ensureAlignPanel();
    ensureMultiInfo();
    ensureContainerAlignPanel();
    ensureZoomCtrl();
    ensureOverlayBtn();
  }
  // 持续保证按钮存在（工具栏是 React 动态渲染的）
  var looping = false;
  function loop() {
    if (looping) return;
    looping = true;
    try { if (ensureToolbarRight()) start(); } finally { looping = false; }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { start(); new MutationObserver(loop).observe(document.body, { childList: true, subtree: true }); });
  else { start(); new MutationObserver(loop).observe(document.body, { childList: true, subtree: true }); }
})();
</script>

  </body>
</html>
