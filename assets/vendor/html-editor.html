      el.classList.remove('ed-hover');
    }
    var sibling = el.nextElementSibling || el.previousElementSibling;
    el.remove();
    hideToolbar();
    selectedId = null;
    notifySelect(null);
    // 选中相邻元素方便连续操作
    if (sibling && isEditableTarget(sibling)) selectElement(sibling);
    notifyChanged();
  }

  function duplicateEl(el) {
    if (!el) return;
    beforeChange();
    var clone = el.cloneNode(true);
    clone.removeAttribute(ID_ATTR);
    clone.classList.remove('ed-selected', 'ed-hover');
    if (el.parentNode) {
      el.parentNode.insertBefore(clone, el.nextSibling);
      assignId(clone);
      selectElement(clone);
    }
    notifyChanged();
  }

  function moveEl(el, dir) {
    if (!el || !el.parentNode) return;
    if (dir === 'up') {
      var prev = el.previousElementSibling;
      if (!prev) return;
      beforeChange();
      el.parentNode.insertBefore(el, prev);
    } else {
      var next = el.nextElementSibling;
      if (!next) return;
      beforeChange();
      el.parentNode.insertBefore(el, next.nextSibling);
    }
    positionToolbar(el);
    notifyChanged();
  }

  /** 在指定元素 前方/后方 插入同类元素（文字或图片） */
  function insertEl(el, where, kind) {
    if (!el) return null;
    beforeChange();
    var newNode;
    if (kind === 'image') {
      newNode = document.createElement('img');
      newNode.setAttribute('src', 'https://placehold.co/300x200/eef2ff/165dff?text=New+Image');
      newNode.setAttribute('alt', '新图片');
      // 沿用参考图片尺寸
      if (el.tagName === 'IMG' && el.getAttribute('width')) {
        newNode.setAttribute('width', el.getAttribute('width'));
        newNode.setAttribute('height', el.getAttribute('height'));
      }
    } else {
      // 文字：沿用参考元素的标签（p/h1/span/div），默认 p
      var refTag = /^(P|H1|H2|H3|H4|H5|H6|SPAN|LI|DIV|A|BUTTON|LABEL)$/.test(el.tagName)
        ? el.tagName
        : 'P';
      newNode = document.createElement(refTag);
      newNode.textContent = '新文字内容';
    }
    if (where === 'before') el.parentNode.insertBefore(newNode, el);
    else el.parentNode.insertBefore(newNode, el.nextSibling);
    assignId(newNode);
    selectElement(newNode);
    notifyChanged();
    return newNode;
  }

  // ============ G8 素材库：插入预设组件 ============
  /** 把 HTML 片段插入到选中元素的同级位置（before/after）或 body 末尾 */
  function insertComponent(html, where) {
    beforeChange('插入组件');
    var tpl = document.createElement('div');
    tpl.innerHTML = html;
    var frag = document.createDocumentFragment();
    var firstNode = null;
    while (tpl.firstChild) {
      assignId(tpl.firstChild);
      // 给所有后代也打标记，便于后续选中编辑
      var desc = tpl.firstChild.querySelectorAll ? tpl.firstChild.querySelectorAll('*') : [];
      for (var d = 0; d < desc.length; d++) assignId(desc[d]);
      if (!firstNode) firstNode = tpl.firstChild;
      frag.appendChild(tpl.firstChild);
    }
    var ref = selectedId ? findById(selectedId) : null;
    var insertedInto = null;
    if (where === 'inside' && ref) {
      // 明确指定：插入到选中元素内部末尾
      ref.appendChild(frag);
      insertedInto = ref;
    } else if (ref && isContainer(ref) && where !== 'after') {
      // 默认：选中是容器 → 插入其内部末尾（更符合"往这个区块加内容"的直觉）
      ref.appendChild(frag);
      insertedInto = ref;
    } else if (ref && ref.parentNode) {
      // 选中不是容器 → 插入到同级后方
      ref.parentNode.insertBefore(frag, ref.nextSibling);
      insertedInto = ref.parentNode;
    } else {
      document.body.appendChild(frag);
      insertedInto = document.body;
    }
    if (firstNode) selectElement(firstNode);
    notifyChanged();
    notifyLayerTree();
  }

  /** 判断元素是否为"容器"（可往内部追加内容） */
  function isContainer(el) {
    if (!el) return false;
    var tag = el.tagName;
    if (/^(SECTION|DIV|ARTICLE|ASIDE|HEADER|FOOTER|NAV|MAIN|LI|TD|TH|FIGURE|BLOCKQUOTE|UL|OL)$/.test(tag)) return true;
    return false;
  }

  // ============ G14 多选群组操作 ============
  function multiDelete() {
    if (selectedIds.length === 0) return;
    beforeChange('批量删除');
    for (var i = 0; i < selectedIds.length; i++) {
      var el = findById(selectedIds[i]);
      if (el) el.remove();
    }
    hideToolbar();
    selectedId = null;
    selectedIds = [];
    notifySelect(null);
    notifyChanged();
    notifyLayerTree();
  }
  function multiDuplicate() {
    if (selectedIds.length === 0) return;
    beforeChange('批量复制');
    var newIds = [];
    for (var i = 0; i < selectedIds.length; i++) {
      var el = findById(selectedIds[i]);
      if (!el) continue;
      var clone = el.cloneNode(true);
      clone.removeAttribute(ID_ATTR);
      clone.classList.remove('ed-selected', 'ed-hover');
      if (el.parentNode) el.parentNode.insertBefore(clone, el.nextSibling);
      assignId(clone);
      newIds.push(clone.getAttribute(ID_ATTR));
    }
    deselectAll();
    for (var k = 0; k < newIds.length; k++) {
      var n = findById(newIds[k]);
      if (n) { n.classList.add('ed-selected'); selectedIds.push(newIds[k]); }
    }
    if (newIds.length) { selectedId = newIds[newIds.length - 1]; var main = findById(selectedId); if (main) { showToolbar(main); notifySelect(buildInfo(main)); } }
    notifyChanged();
    notifyLayerTree();
  }

  function replaceImageSrc(id, src) {
    var el = findById(id);
    if (!el) return;
    beforeChange();
    el.setAttribute('src', src);
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  function selectParent() {
    var el = findById(selectedId);
    if (el && el.parentElement && el.parentElement !== document.body) {
      selectElement(el.parentElement);
    }
  }

  // ============ 滚动/resize 同步工具条 ============
  window.addEventListener('scroll', function () {
    if (selectedId && toolbar) {
      var el = findById(selectedId);
      if (el) positionToolbar(el);
    }
  });
  window.addEventListener('resize', function () {
    if (selectedId && toolbar) {
      var el = findById(selectedId);
      if (el) positionToolbar(el);
    }
  });

  // ============ 快捷键：iframe 内独立的撤销/重做/Delete（事件不冒泡到父窗口）============
  document.addEventListener('keydown', function (e) {
    // 正在编辑文字时，所有快捷键让浏览器原生处理（contenteditable 编辑）
    if (editingId) return;
    var mod = e.ctrlKey || e.metaKey;
    var key = e.key.toLowerCase();
    if (mod && key === 'z' && !e.shiftKey) {
      e.preventDefault();
      undo();
    } else if (mod && (key === 'y' || (key === 'z' && e.shiftKey))) {
      e.preventDefault();
      redo();
    } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
      // 删除选中元素（多选时批量删除）
      e.preventDefault();
      if (selectedIds.length > 1) multiDelete(); else deleteEl(findById(selectedId));
    } else if (mod && key === 'd' && selectedIds.length > 0) {
      // Ctrl/Cmd+D 复制（多选时批量复制）
      e.preventDefault();
      if (selectedIds.length > 1) multiDuplicate(); else duplicateEl(findById(selectedId));
    } else if ((e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') && selectedId) {
      // G12 方向键微移（iframe 内处理，因为 iframe 的按键不冒泡到父窗口）
      // Shift=大步10px，普通=1px；Alt+上/下=调整同级顺序
      e.preventDefault();
      if (e.altKey) {
        if (e.key === 'ArrowUp') reorderElement('up');
        else if (e.key === 'ArrowDown') reorderElement('down');
      } else {
        var step = e.shiftKey ? 10 : 1;
        var dir = e.key === 'ArrowUp' ? 'up' : e.key === 'ArrowDown' ? 'down' : e.key === 'ArrowLeft' ? 'left' : 'right';
        nudgeElement(dir, step);
      }
    } else if (e.key === 'Escape' && selectedId) {
      deselectAll();
      hideToolbar();
      notifySelect(null);
    }
  }, true);

  // ============ 导出：清理编辑标记，返回干净 HTML ============
  function getCleanHtml() {
    // 注意：不要调用 deselectAll()，那会清除 selectedId 导致方向键等连续操作失效。
    // 只在克隆节点上清理编辑标记，不影响实际 DOM 的选中状态。
    var cloneDoc = document.documentElement.cloneNode(true);
    // 移除注入的 script / style / 工具条 / overlay
    var injected = cloneDoc.querySelectorAll('[data-ed-injected]');
    for (var i = 0; i < injected.length; i++) injected[i].remove();
    // 移除标记属性
    var all = cloneDoc.querySelectorAll('[' + ID_ATTR + ']');
    for (var j = 0; j < all.length; j++) {
      all[j].removeAttribute(ID_ATTR);
      all[j].classList.remove('ed-hover', 'ed-selected', 'ed-editing');
      if (all[j].getAttribute('contenteditable') === 'true') all[j].removeAttribute('contenteditable');
      if (all[j].getAttribute('class') === '') all[j].removeAttribute('class');
    }
    return '<!doctype html>\n' + cloneDoc.outerHTML;
  }

  // ============ 设置元素背景图（页面头部 / 任意容器） ============
  function setBgImage(id, src) {
    var el = findById(id);
    if (!el || !src) return;
    beforeChange();
    el.style.backgroundImage = 'url("' + src + '")';
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.style.backgroundRepeat = 'no-repeat';
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  // ============ 文字样式（字号 / 颜色 / 模块色 / 背景色）============
  function setFontSize(id, px) {
    var el = findById(id);
    if (!el) return;
    beforeChange();
    el.style.fontSize = px + 'px';
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  function setTextColor(id, color) {
    var el = findById(id);
    if (!el) return;
    beforeChange();
    el.style.color = color;
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  /** 模块颜色 = 文字所在块级容器的背景色（与元素自身背景色区别） */
  function setModuleColor(id, color) {
    var el = findById(id);
    if (!el) return;
    var mod = findModuleContainer(el) || el;
    beforeChange();
    mod.style.backgroundColor = color;
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  /** 选中元素自身的背景颜色 */
  function setBgColor(id, color) {
    var el = findById(id);
    if (!el) return;
    beforeChange();
    el.style.backgroundColor = color;
    notifyChanged();
    notifySelect(buildInfo(el));
  }

  // ============ G1/G2/G3 文字排版样式（对齐/加粗/斜体/下划线/行高/字间距）============
  /** 对单个元素或当前多选集合应用内联样式 */
  function applyStyleToTargets(fn, label) {
    var ids = selectedIds.length > 0 ? selectedIds.slice() : (selectedId ? [selectedId] : []);
    if (ids.length === 0) return;
    beforeChange(label);
    for (var i = 0; i < ids.length; i++) {
      var el = findById(ids[i]);
      if (el) fn(el);
    }
    notifyChanged();
    var main = findById(selectedId);
    if (main) notifySelect(buildInfo(main));
  }

  function setTextAlign(align) {
    applyStyleToTargets(function (el) { el.style.textAlign = align; }, '对齐');
  }
  /** 切换加粗（bold<->normal） */
  function toggleBold() {
    applyStyleToTargets(function (el) {
      var w = window.getComputedStyle(el).fontWeight;
      el.style.fontWeight = (w === 'bold' || parseInt(w, 10) >= 600) ? 'normal' : 'bold';
    }, '加粗');
  }
  function toggleItalic() {
    applyStyleToTargets(function (el) {
      var s = window.getComputedStyle(el).fontStyle;
      el.style.fontStyle = s === 'italic' || s === 'oblique' ? 'normal' : 'italic';
    }, '斜体');
  }
  function toggleUnderline() {
    applyStyleToTargets(function (el) {
      var d = window.getComputedStyle(el).textDecorationLine;
      el.style.textDecorationLine = (d && d.indexOf('underline') >= 0) ? 'none' : 'underline';
    }, '下划线');
  }
  function setLineHeight(val) {
    applyStyleToTargets(function (el) { el.style.lineHeight = val; }, '行高');
  }
  function setLetterSpacing(val) {
    applyStyleToTargets(function (el) { el.style.letterSpacing = val + 'px'; }, '字间距');
  }

  // ============ G12 键盘微移（通过消息驱动，不依赖 iframe 焦点）============
  /** 像素级微移选中元素：dir=up/down/left/right, step=像素数 */
  function nudgeElement(dir, step) {
    if (!selectedId && selectedIds.length === 0) return;
    var ids = selectedIds.length > 0 ? selectedIds : [selectedId];
    beforeChange('微移');
    for (var i = 0; i < ids.length; i++) {
      var el = findById(ids[i]);
      if (!el) continue;
      var cs = window.getComputedStyle(el);
      if (cs.position === 'static') el.style.position = 'relative';
      var curLeft = parseFloat(el.style.left) || 0;
      var curTop = parseFloat(el.style.top) || 0;
      if (dir === 'up') el.style.top = (curTop - step) + 'px';
      else if (dir === 'down') el.style.top = (curTop + step) + 'px';
      else if (dir === 'left') el.style.left = (curLeft - step) + 'px';
      else if (dir === 'right') el.style.left = (curLeft + step) + 'px';
    }
    notifyChanged();
    var main = findById(selectedId);
    if (main) { positionToolbar(main); }
  }
  /** 调整选中元素在同级中的顺序：dir=up/down */
  function reorderElement(dir) {
    if (!selectedId) return;
    moveEl(findById(selectedId), dir);
  }

  // ============ G6 元素对齐辅助（多选时，以主选中为基准对齐）============
  function alignElements(mode) {
    if (selectedIds.length < 2) return;
    beforeChange('对齐');
    var els = [];
    for (var i = 0; i < selectedIds.length; i++) {
      var el = findById(selectedIds[i]);
      if (el) els.push(el);
    }
    if (els.length < 2) return;
    // 只对 static 定位无意义，先把所有元素设为 relative 以便用 top/left 微调
    for (var k = 0; k < els.length; k++) {
      var cs = window.getComputedStyle(els[k]);
      if (cs.position === 'static') els[k].style.position = 'relative';
    }
    var base = els[0].getBoundingClientRect();
    for (var j = 1; j < els.length; j++) {
      var r = els[j].getBoundingClientRect();
      var dx = 0, dy = 0;
      if (mode === 'left') dx = base.left - r.left;
      else if (mode === 'right') dx = base.right - r.right;
      else if (mode === 'centerH') dx = (base.left + base.width / 2) - (r.left + r.width / 2);
      else if (mode === 'top') dy = base.top - r.top;
      else if (mode === 'bottom') dy = base.bottom - r.bottom;
      else if (mode === 'centerV') dy = (base.top + base.height / 2) - (r.top + r.height / 2);
      var curLeft = parseFloat(els[j].style.left) || 0;
      var curTop = parseFloat(els[j].style.top) || 0;
      if (dx) els[j].style.left = (curLeft + dx) + 'px';
      if (dy) els[j].style.top = (curTop + dy) + 'px';
    }
    notifyChanged();
    var main = findById(selectedId);
    if (main) notifySelect(buildInfo(main));
  }

  // ============ G10 批量替换文字 ============
  /** 全页查找并替换文字内容（innerText 层级，保留标签结构） */
  function batchReplaceText(find, replace, options) {
    if (!find) return;
    options = options || {};
    beforeChange('批量替换');
    var count = 0;
    var all = document.body.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (!isEditableTarget(el)) continue;
      // 只处理直接包含文本节点的元素，不递归（避免重复替换）
      for (var c = 0; c < el.childNodes.length; c++) {
        var node = el.childNodes[c];
        if (node.nodeType === 3 && node.nodeValue && node.nodeValue.indexOf(find) >= 0) {
          var val = node.nodeValue;
          var newVal = options.ignoreCase
            ? val.replace(new RegExp(escapeRegExp(find), 'gi'), replace)
            : val.split(find).join(replace);
          if (newVal !== val) { node.nodeValue = newVal; count++; }
        }
      }
    }
    notifyChanged();
    HOST.postMessage({ source: 'ed-editor', type: 'BATCH_RESULT', payload: { count: count } }, '*');
  }
  function escapeRegExp(s) {
    // 不使用正则字面量/反斜杠（本文件会被嵌入 String.raw 模板字符串）。
    // 纯字符串逐字符处理：遇到特殊字符则在前面加反斜杠。
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      if ('.*+?^$()|[]'.indexOf(ch) >= 0) out += '\\' + ch;
      else out += ch;
    }
    return out;
  }

  /** 批量替换所有图片 src（把页面内所有 <img> 换成指定 src） */
  function batchReplaceImage(src) {
    if (!src) return;
    beforeChange('批量替换图片');
    var count = 0;
    var imgs = document.body.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) {
      if (imgs[i].hasAttribute('data-ed-injected')) continue;
      imgs[i].setAttribute('src', src);
      count++;
    }
    notifyChanged();
    HOST.postMessage({ source: 'ed-editor', type: 'BATCH_RESULT', payload: { count: count } }, '*');
  }

  // ============ G13 元素层级树 ============
  /** 构建当前文档的层级树（精简，只取可见块级元素，深度限制） */
  function notifyLayerTree() {
    var tree = [];
    if (!document.body) { HOST.postMessage({ source: 'ed-editor', type: 'LAYER_TREE', payload: tree }, '*'); return; }
    function walk(el, depth) {
      if (depth > 5) return;
      if (!isEditableTarget(el)) return;
      var id = el.getAttribute(ID_ATTR);
      var tag = el.tagName.toLowerCase();
      var txt = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 24);
      var cls = '';
      if (el.className && typeof el.className === 'string') {
        var arr = el.className.split(/\s+/).filter(function (x) { return x && x.indexOf('ed-') !== 0; });
        if (arr.length) cls = arr.slice(0, 2).join(' ');
      }
      tree.push({ id: id, tag: tag, cls: cls, text: txt, depth: depth, selected: selectedIds.indexOf(id) >= 0 });
      // 只递归有意义的容器
      var children = el.children;
      for (var i = 0; i < children.length && tree.length < 200; i++) {
        var child = children[i];
        var ctag = child.tagName;
        if (/^(SCRIPT|STYLE|LINK|META|HEAD)$/.test(ctag)) continue;
        walk(child, depth + 1);
      }
    }
    var top = document.body.children;
    for (var t = 0; t < top.length && tree.length < 200; t++) walk(top[t], 0);
    HOST.postMessage({ source: 'ed-editor', type: 'LAYER_TREE', payload: tree }, '*');
  }
  function notifySelectMulti() {
    HOST.postMessage({ source: 'ed-editor', type: 'MULTI_SELECT', payload: { count: selectedIds.length, ids: selectedIds.slice() } }, '*');
  }
  /** 层级树点选：跳转到某元素（可选追加多选） */
  function selectByIdFromTree(id, additive) {
    var el = findById(id);
    if (!el) return;
    if (additive) toggleSelect(el); else selectElement(el);
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ============ G7 标尺与网格 ============
  var gridSize = 50; // 网格大小（px）
  function toggleGrid() {
    gridVisible = !gridVisible;
    showGrid();
  }
  function showGrid() {
    var overlay = document.getElementById('ed-grid-overlay');
    if (gridVisible) {
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'ed-grid-overlay';
        overlay.setAttribute('data-ed-injected', '1');
        document.body.appendChild(overlay);
      }
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2147483645;background-image:linear-gradient(rgba(22,93,255,0.12) 1px,transparent 1px),linear-gradient(90deg,rgba(22,93,255,0.12) 1px,transparent 1px);background-size:' + gridSize + 'px ' + gridSize + 'px;';
      overlay.style.display = 'block';
    } else if (overlay) {
      overlay.style.display = 'none';
    }
  }
  /** 设置网格大小 */
  function setGridSize(size) {
    gridSize = parseInt(size, 10) || 50;
    if (gridVisible) showGrid();
  }

  // ============ 接收父窗口消息 ============
  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== 'ed-host') return;
    switch (msg.type) {
      case 'REPLACE_IMAGE':
        replaceImageSrc(msg.payload.id, msg.payload.src);
        break;
      case 'SET_BG_IMAGE':
        setBgImage(msg.payload.id, msg.payload.src);
        break;
      case 'SET_FONT_SIZE':
        setFontSize(msg.payload.id, msg.payload.px);
        break;
      case 'SET_TEXT_COLOR':
        setTextColor(msg.payload.id, msg.payload.color);
        break;
      case 'SET_MODULE_COLOR':
        setModuleColor(msg.payload.id, msg.payload.color);
        break;
      case 'SET_BG_COLOR':
        setBgColor(msg.payload.id, msg.payload.color);
        break;
      case 'SET_TEXT_ALIGN':
        setTextAlign(msg.payload.align);
        break;
      case 'TOGGLE_BOLD':
        toggleBold();
        break;
      case 'TOGGLE_ITALIC':
        toggleItalic();
        break;
      case 'TOGGLE_UNDERLINE':
        toggleUnderline();
        break;
      case 'SET_LINE_HEIGHT':
        setLineHeight(msg.payload.val);
        break;
      case 'SET_LETTER_SPACING':
        setLetterSpacing(msg.payload.val);
        break;
      case 'ALIGN_ELEMENTS':
        alignElements(msg.payload.mode);
        break;
      case 'NUDGE':
        nudgeElement(msg.payload.dir, msg.payload.step);

    if (document.getElementById('ed-batch-btn')) return;
    var b = document.createElement('button');
    b.id = 'ed-batch-btn'; b.type = 'button'; b.className = 'btn'; b.textContent = '🔄 批量';
    b.title = '批量查找替换文字/图片';
    b.addEventListener('click', openBatchReplace);
    right.insertBefore(b, right.firstChild);
  }

  // ============ G13 元素层级树 ============
  var layerTree = [];
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.source === 'ed-editor' && d.type === 'LAYER_TREE') { layerTree = d.payload || []; renderLayerTree(); }
  });
  var layerPanel = null;
  function ensureLayerBtn() {
    var right = ensureToolbarRight(); if (!right) return;
    if (document.getElementById('ed-layer-btn')) return;
    var b = document.createElement('button');
    b.id = 'ed-layer-btn'; b.type = 'button'; b.className = 'btn'; b.textContent = '🗂 层级';
    b.title = '显示/隐藏元素层级树';
    b.addEventListener('click', toggleLayerTree);
    right.insertBefore(b, right.firstChild);
  }
  function toggleLayerTree() {
    if (layerPanel && layerPanel.isConnected) { layerPanel.remove(); layerPanel = null; return; }
    layerPanel = document.createElement('aside');
    layerPanel.className = 'ed-layer-panel';
    layerPanel.style.cssText = 'position:fixed;left:0;top:52px;bottom:0;width:240px;background:var(--bg-panel);border-right:1px solid var(--border);z-index:50;display:flex;flex-direction:column;box-shadow:var(--shadow-md)';
    var head = document.createElement('div');
    head.style.cssText = 'padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center';
    head.innerHTML = '<span>元素层级</span>';
    var close = document.createElement('button'); close.className = 'btn btn-ghost'; close.textContent = '✕'; close.addEventListener('click', toggleLayerTree);
    head.appendChild(close);
    var list = document.createElement('div');
    list.className = 'ed-layer-list';
    list.style.cssText = 'flex:1;overflow:auto;padding:6px';
    layerPanel.appendChild(head); layerPanel.appendChild(list);
    document.body.appendChild(layerPanel);
    renderLayerTree();
    postToIframe({ source: 'ed-host', type: 'GET_LAYER_TREE' });
  }
  function renderLayerTree() {
    if (!layerPanel || !layerPanel.isConnected) return;
    var list = layerPanel.querySelector('.ed-layer-list');
    if (!list) return;
    list.innerHTML = '';
    if (!layerTree.length) { list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:12px">请先上传 HTML</div>'; return; }
    layerTree.forEach(function (node) {
      var row = document.createElement('div');
      var ind = node.depth * 14;
      row.style.cssText = 'padding:5px 8px;margin:1px 0;border-radius:4px;cursor:pointer;font-size:12px;padding-left:' + (8 + ind) + 'px;' + (node.selected ? 'background:var(--accent-bg);color:var(--accent)' : 'color:var(--text-primary)');
      row.innerHTML = '<span style="font-family:monospace">' + node.tag + '</span>' + (node.cls ? '<span style="color:var(--text-tertiary">.' + node.cls.split(' ')[0] + '</span>' : '') + (node.text ? '<span style="color:var(--text-tertiary);margin-left:6px">' + node.text + '</span>' : '');
      row.title = node.id || '';
      row.addEventListener('click', function (e) {
        postToIframe({ source: 'ed-host', type: 'TREE_SELECT', payload: { id: node.id, additive: e.shiftKey } });
      });
      list.appendChild(row);
    });
  }

  // ============ G6 元素对齐辅助 + G14 多选提示（浮动面板）============
  var alignPanel = null;
  function ensureAlignPanel() {
    if (alignPanel && alignPanel.isConnected) return;
    alignPanel = document.createElement('div');
    alignPanel.className = 'ed-align-panel';
    alignPanel.style.cssText = 'position:fixed;top:62px;right:300px;z-index:40;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:8px;box-shadow:var(--shadow-md);display:none;gap:4px;align-items:center';
    alignPanel.innerHTML = '<span style="font-size:11px;color:var(--text-tertiary);margin-right:4px">对齐</span>';
    var btns = [
      ['left', '⬅ 左'], ['centerH', '⬌ 中'], ['right', '➡ 右'],
      ['top', '⬆ 顶'], ['centerV', '⬍ 中'], ['bottom', '⬇ 底']
    ];
    btns.forEach(function (b) {
      var btn = document.createElement('button');
      btn.className = 'btn btn-ghost'; btn.style.fontSize = '11px'; btn.style.padding = '3px 8px';
      btn.textContent = b[1]; btn.title = b[0];
      btn.addEventListener('click', function () { postToIframe({ source: 'ed-host', type: 'ALIGN_ELEMENTS', payload: { mode: b[0] } }); });
      alignPanel.appendChild(btn);
    });
    document.body.appendChild(alignPanel);
  }
  var multiInfo = null;
  function ensureMultiInfo() {
    if (multiInfo && multiInfo.isConnected) return;
    multiInfo = document.createElement('div');
    multiInfo.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2129;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:40;display:none;box-shadow:var(--shadow-lg);align-items:center;gap:8px';
    multiInfo.innerHTML = '<span class="ed-mc">已选 1 个</span><button class="ed-md" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px">复制</button><button class="ed-mx" style="background:#f53f3f;color:#fff;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px">删除</button>';
    multiInfo.querySelector('.ed-md').addEventListener('click', function () { postToIframe({ source: 'ed-host', type: 'MULTI_DUPLICATE' }); });
    multiInfo.querySelector('.ed-mx').addEventListener('click', function () { postToIframe({ source: 'ed-host', type: 'MULTI_DELETE' }); });
    document.body.appendChild(multiInfo);
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'ed-editor') return;
    if (d.type === 'MULTI_SELECT') {
      if (!multiInfo) ensureMultiInfo();
      var n = d.payload.count;
      multiInfo.style.display = n > 1 ? 'flex' : 'none';
      var mc = multiInfo.querySelector('.ed-mc'); if (mc) mc.textContent = '已选 ' + n + ' 个（Shift+点击多选）';
      // 多选时显示对齐面板
      if (alignPanel) alignPanel.style.display = n >= 2 ? 'flex' : 'none';
    }
  });

  // ============ 监听 BATCH_RESULT ============
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.source === 'ed-editor' && d.type === 'BATCH_RESULT') {
      closeModal();
      var tip = document.createElement('div');
      tip.style.cssText = 'text-align:center;padding:20px;color:var(--text-primary)';
      tip.textContent = '✓ 已替换 ' + d.payload.count + ' 处';
      openModal('替换完成', tip, { noFooter: false });
    }
  });

  // ============ 初始化 ============
  function start() {
    ensureGridBtn();
    ensureHistoryBtn();
    ensureLibraryBtn();
    ensureBatchBtn();
    ensureLayerBtn();
    ensureAlignPanel();
    ensureMultiInfo();
  }
  // 持续保证按钮存在（工具栏是 React 动态渲染的）
  var looping = false;
  function loop() {
    if (looping) return;
    looping = true;
    try { if (ensureToolbarRight()) start(); } finally { looping = false; }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { start(); new MutationObserver(loop).observe(document.body, { childList: true, subtree: true }); });
  else { start(); new MutationObserver(loop).observe(document.body, { childList: true, subtree: true }); }
})();
</script>

  </body>
</html>
